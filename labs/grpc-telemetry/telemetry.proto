syntax = "proto3";

package telemetry.v1;

// The contract both sides compile against. Field numbers, not names, go on the wire,
// so fields can be renamed freely and new ones added without breaking old clients.
service Telemetry {
  rpc GetLap (LapRequest) returns (Lap);                      // unary
  rpc StreamLaps (StreamRequest) returns (stream Lap);        // server streaming
}

message LapRequest {
  string car = 1;
  int32 lap = 2;
}

message StreamRequest {
  string car = 1;
  int32 from_lap = 2;
  int32 delay_ms = 3;   // simulate a slow feed, to show deadlines
}

message Lap {
  string car = 1;
  int32 lap = 2;
  double lap_time_s = 3;
  double top_speed_kph = 4;
  repeated double sector_times_s = 5;
  TyreCompound tyre = 6;
}

enum TyreCompound {
  TYRE_COMPOUND_UNSPECIFIED = 0;
  SOFT = 1;
  MEDIUM = 2;
  HARD = 3;
}
