name: labs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(python3 scripts/matrix.py)" >> "$GITHUB_OUTPUT"

  lab:
    needs: discover
    name: ${{ matrix.lab }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.runtime == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - if: startsWith(matrix.runtime, 'dotnet')
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - if: matrix.runtime == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - if: matrix.runtime == 'terraform'
        uses: hashicorp/setup-terraform@v3
      - name: Run lab
        shell: bash
        run: bash labs/${{ matrix.lab }}/ci.sh
